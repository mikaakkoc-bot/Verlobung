.std{position:absolute;left:0;right:0;top:calc(var(--u)*50);z-index:1;display:flex;flex-direction:column;align-items:center;font-family:var(--script);font-size:calc(var(--u)*72);line-height:1.02;color:var(--ink);text-shadow:0 calc(var(--u)*1) 0 rgba(255,250,240,.45)}
.std span{display:block;animation:write 1.5s cubic-bezier(.45,0,.25,1) .3s both}
.std span:first-child{margin-right:calc(var(--u)*54)}
.std span:last-child{margin-left:calc(var(--u)*96);animation-delay:1.35s}
@keyframes write{from{clip-path:inset(calc(var(--u)*-30) 100% calc(var(--u)*-30) calc(var(--u)*-40))}to{clip-path:inset(calc(var(--u)*-30) calc(var(--u)*-60) calc(var(--u)*-30) calc(var(--u)*-40))}}

.envwrap{position:absolute;inset:0}
.eb,.ef{position:absolute;left:calc(var(--u)*30);top:calc(var(--u)*370);width:calc(var(--u)*330);height:calc(var(--u)*225);overflow:visible}
.eb{z-index:1;filter:drop-shadow(0 calc(var(--u)*12) calc(var(--u)*16) rgba(80,60,35,.32))}
.ef{z-index:3;filter:drop-shadow(0 calc(var(--u)*-2) calc(var(--u)*3) rgba(110,85,50,.22))}
.fl{position:absolute;left:calc(var(--u)*30);top:calc(var(--u)*370);width:calc(var(--u)*330);height:calc(var(--u)*132);overflow:visible;z-index:4;transform-origin:50% 0;transform:translateY(0) perspective(calc(var(--u)*900)) rotateX(0deg);filter:drop-shadow(0 calc(var(--u)*5) calc(var(--u)*5) rgba(110,85,50,.3))}
.fw{position:absolute;left:calc(var(--u)*224);top:calc(var(--u)*348);width:calc(var(--u)*185);height:calc(var(--u)*370);overflow:visible;z-index:5;pointer-events:none}

.card{position:absolute;left:calc(var(--u)*50);top:calc(var(--u)*382);width:calc(var(--u)*290);height:calc(var(--u)*400);z-index:2;padding:calc(var(--u)*42) calc(var(--u)*36) calc(var(--u)*38);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*9);text-align:center;color:var(--ink);background:radial-gradient(120% 80% at 30% 10%,#FFFDF8,var(--paper) 70%);box-shadow:0 calc(var(--u)*22) calc(var(--u)*36) calc(var(--u)*-16) rgba(80,60,35,.5),0 calc(var(--u)*1) 0 rgba(255,255,255,.8) inset;clip-path:inset(0 0 calc(var(--u)*197) 0)}

.frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.k-eyebrow{position:relative;font-family:var(--caps);font-weight:600;font-size:calc(var(--u)*10.5);letter-spacing:.24em;color:var(--ink-soft)}
.k-names{position:relative;font-family:var(--script);font-weight:400;font-size:calc(var(--u)*46);line-height:1.14;color:var(--ink-strong)}
.k-text{position:relative;font-family:var(--serif);font-weight:600;font-size:calc(var(--u)*17);line-height:1.35;text-wrap:pretty}
.k-date{position:relative;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1);font-weight:600;font-size:calc(var(--u)*17);line-height:1.3}
.k-date .big{font-family:var(--caps);font-size:calc(var(--u)*18);letter-spacing:.08em;margin-block:calc(var(--u)*2)}
.k-place svg{width:calc(var(--u)*13);height:calc(var(--u)*13);flex:none}
.k-place{position:relative;display:inline-flex;align-items:center;gap:calc(var(--u)*5);min-height:calc(var(--u)*28);font-style:italic;font-weight:600;font-size:calc(var(--u)*15);color:var(--ink);text-decoration:underline;text-decoration-color:rgba(59,42,29,.35);text-underline-offset:calc(var(--u)*3)}

.toggle{position:absolute;left:0;top:0;width:calc(var(--u)*1);height:calc(var(--u)*1);margin:0;opacity:0;pointer-events:none}
.tap{position:absolute;left:calc(var(--u)*30);top:calc(var(--u)*360);width:calc(var(--u)*330);height:calc(var(--u)*346);z-index:7;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;-webkit-tap-highlight-color:transparent}
.label{position:relative;display:flex;align-items:center;justify-content:center;width:calc(var(--u)*260);height:calc(var(--u)*60);color:var(--ink);text-decoration:none;filter:drop-shadow(0 calc(var(--u)*6) calc(var(--u)*8) rgba(80,60,35,.28))}
.doily{position:absolute;left:calc(var(--u)*-6);top:calc(var(--u)*-6);width:calc(var(--u)*272);height:calc(var(--u)*72)}
.lt{position:relative;font-family:var(--serif);font-weight:600;font-size:calc(var(--u)*18);letter-spacing:.01em}
.tap .label{animation:breathe 2.6s ease-in-out infinite}
.maps{position:absolute;left:calc(var(--u)*65);top:calc(var(--u)*762);z-index:7;opacity:0;visibility:hidden}
.toggle:focus-visible ~ .tap .lt,.maps:focus-visible .lt,.k-place:focus-visible{outline:calc(var(--u)*2) solid var(--focus);outline-offset:calc(var(--u)*4)}

.cd[hidden]{display:none}
.cd{position:absolute;left:0;right:0;top:calc(var(--u)*30);z-index:7;display:flex;justify-content:center;gap:calc(var(--u)*14);opacity:0;visibility:hidden}
.cd div{width:calc(var(--u)*66);padding:calc(var(--u)*10) 0 calc(var(--u)*8);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*5);background:var(--ivory);border:calc(var(--u)*1) solid var(--line);outline:calc(var(--u)*1) solid var(--ivory);outline-offset:calc(var(--u)*3);box-shadow:0 calc(var(--u)*6) calc(var(--u)*14) calc(var(--u)*-6) rgba(80,60,35,.4)}
.cd b{font-family:var(--caps);font-weight:600;font-size:calc(var(--u)*22);line-height:1;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.cd small{font-family:var(--caps);font-weight:600;font-size:calc(var(--u)*7.5);letter-spacing:.14em;color:var(--ink-soft)}

/* Opening: flap 0–0.9s, card rises 0.9–2.15s, card to front + envelope down 2.25–3.35s, countdown and address label 2.75s */
.toggle:checked ~ .tap{animation:fade-out .3s ease forwards;pointer-events:none}
.toggle:checked ~ .std{animation:std-out .7s ease .9s forwards}
.toggle:checked ~ .envwrap .fl{animation:flap-open 3.35s linear forwards}
.toggle:checked ~ .card{animation:card-out 3.25s linear forwards}
.toggle:checked ~ .envwrap .eb,.toggle:checked ~ .envwrap .ef,.toggle:checked ~ .envwrap .fw{animation:env-down 1.1s cubic-bezier(.65,0,.25,1) 2.25s forwards}
.toggle:checked ~ .maps,.toggle:checked ~ .cd{animation:show .6s ease 2.75s forwards}
@keyframes fade-out{to{opacity:0}}
@keyframes std-out{to{opacity:0;transform:translateY(calc(var(--u)*-18))}}
@keyframes flap-open{
  0%{transform:translateY(0) perspective(calc(var(--u)*900)) rotateX(0deg);z-index:4;animation-timing-function:cubic-bezier(.5,0,.25,1)}
  13.4%{z-index:4}
  13.5%{z-index:1}
  26.9%{transform:translateY(0) perspective(calc(var(--u)*900)) rotateX(180deg)}
  67.2%{transform:translateY(0) perspective(calc(var(--u)*900)) rotateX(180deg);animation-timing-function:cubic-bezier(.65,0,.25,1)}
  100%{transform:translateY(calc(var(--u)*150)) perspective(calc(var(--u)*900)) rotateX(180deg);z-index:1}
}

  0%{transform:translateY(0);clip-path:inset(0 0 calc(var(--u)*197) 0);z-index:2}

  }
  tick();
  setInterval(tick, 1000);
  cd.hidden = false;
})();
</script>
